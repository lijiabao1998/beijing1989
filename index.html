<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>北京，一九八九 — An Ordinary Spring</title>
<link rel="icon" href="./favicon.svg" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="film-grade" aria-hidden="true"></div>
<div id="letterbox-top" aria-hidden="true"></div>
<div id="letterbox-bot" aria-hidden="true"></div>
<div id="hud" hidden>
  <div id="hud-top">
    <div id="date">1989 年 4 月 17 日・晚</div>
    <div id="btns"><button id="b-auto" type="button">自動引導：關</button><div id="speed-wrap"><button id="b-speed" type="button" title="選擇播放倍速 (- / +)">倍速：1x</button><div id="speed-menu" hidden role="menu" aria-label="播放倍速選擇"><button type="button" class="spd-opt" data-speed="0.5">0.5x</button><button type="button" class="spd-opt" data-speed="0.75">0.75x</button><button type="button" class="spd-opt on" data-speed="1">1x</button><button type="button" class="spd-opt" data-speed="1.25">1.25x</button><button type="button" class="spd-opt" data-speed="1.5">1.5x</button><button type="button" class="spd-opt" data-speed="2">2x</button><button type="button" class="spd-opt" data-speed="3">3x</button><button type="button" class="spd-opt" data-speed="4">4x</button><button type="button" class="spd-opt" data-speed="6">6x</button><button type="button" class="spd-opt" data-speed="8">8x</button><span id="speed-hint">快捷鍵 - / +，點擊直選倍速</span></div></div><button id="b-cam" class="cine" type="button" title="切換鏡頭運鏡模式 (C)">運鏡：電影</button><button id="b-audio" type="button">聲音：開</button><button id="b-map" type="button" title="1989 街區示意圖與多線時間軸 (M)">地圖/時間軸</button><button id="b-lens" type="button" title="切換 35mm 相機取景框 (F)" hidden>取景 (F)</button><button id="b-reel" type="button">影片</button><button id="b-book" type="button" title="翻閱 1980 年代六十四開連環畫冊">畫冊</button><button id="b-turn" type="button">轉身</button><button id="b-diary" type="button">日記</button><button id="b-src" type="button">史料</button><button id="b-menu" type="button">選單</button></div>
  </div>
  <div id="hud-sub">
    <div id="timeline" aria-label="章節時間軸"></div>
    <div id="guide"><span id="guide-txt"></span><button id="b-guide" type="button" hidden>引導前往</button></div>
  </div>
</div>
<div id="stick" hidden><div id="knob"></div></div>
<button id="act" hidden></button>
<div id="ambient-whisper" hidden aria-live="polite"><span id="whisper-who"></span><span id="whisper-txt"></span></div>
<div id="dlg" hidden>
  <div id="dlg-auto" hidden>
    <div id="dlg-auto-top"><span id="dlg-auto-lbl">自動引導進行中</span><div id="dlg-speeds" role="group" aria-label="快速切換倍速"><button type="button" class="dlg-spd-opt" data-speed="0.5">0.5x</button><button type="button" class="dlg-spd-opt on" data-speed="1">1x</button><button type="button" class="dlg-spd-opt" data-speed="2">2x</button><button type="button" class="dlg-spd-opt" data-speed="4">4x</button><button type="button" class="dlg-spd-opt" data-speed="6">6x</button><button type="button" class="dlg-spd-opt" data-speed="8">8x</button></div><button id="dlg-speed" type="button">倍速：1x</button></div>
    <div class="dlg-bar"><div id="dlg-fill"></div></div>
  </div>
  <div id="dlg-head"><div id="who"></div><div id="dlg-head-acts"><button id="dlg-inspect" type="button" hidden>細看實物</button><button id="dlg-speak" type="button" title="朗讀本段對話">朗讀</button></div></div><div id="txt"></div><button id="srcbtn" hidden>查看史料來源</button><div id="ch"></div>
</div>
<div id="modal" hidden><div class="card"><button class="x" id="mclose">×</button><div id="mbody"></div></div></div>
<div id="title">
  <div class="card t">
    <h1>北京，一九八九</h1>
    <h2>An Ordinary Spring・一個平凡的春天</h2>
    <p class="lead">歷史的結果已經確定。你是一個普通人：看到了什麼、相信了什麼、幫助了誰、最後留下了什麼。</p>
    <div class="vp-switch" id="vp-switch" role="tablist" aria-label="選擇視角篇章">
      <button id="vp-student" type="button" class="vp-btn active" data-vp="student">
        <strong>第一篇・學生視角（陳立）</strong>
        <span>北大物理系學生｜4/17 — 6/05 全八章</span>
      </button>
      <button id="vp-worker" type="button" class="vp-btn" data-vp="worker">
        <strong>第二篇・工人視角（王建國）</strong>
        <span>北京第二機床廠車工｜4/17 — 6/05 全八章</span>
      </button>
      <button id="vp-journalist" type="button" class="vp-btn" data-vp="journalist">
        <strong>第三篇・記者視角（顧明遠）</strong>
        <span>首都晨報記者｜4/17 — 6/05 全八章</span>
      </button>
      <button id="vp-resident" type="button" class="vp-btn" data-vp="resident">
        <strong>第四篇・市民視角（沈淑芬）</strong>
        <span>西單四合院退休護師｜4/17 — 6/05 全八章</span>
      </button>
    </div>
    <p class="small" id="vp-desc">全八章線性紀事（4 月 17 日 ➔ 6 月 5 日）。你是一名普通人，前一章的選擇會帶到下一章。可親自操作探索，也可開啟「自動引導」或「全八章故事影片」免操作並以自選倍速完整體驗。</p>
    <div class="row"><button id="b-new">開始</button><button id="b-cont" hidden>繼續</button></div>
    <div class="row sub-row"><button id="b-auto-start" class="accent-btn" type="button">自動引導模式（免操作走完全劇情）</button><button id="b-watch-all" class="accent-btn" type="button">觀看全八章故事影片</button></div>
    <div id="chsel" hidden></div>
  </div>
</div>
<div id="fade"><div id="fadetxt"></div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
