name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [render, routes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: "Puppeteer smoke test (${{ matrix.shard }})"
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SHOTS: shots
          SMOKE_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: shots
